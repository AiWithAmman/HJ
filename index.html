<!DOCTYPE html>
<html>
<head>
  <title>ramadan pen</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; background: #3d3124; overflow: hidden; }
    video { display: none; }
    canvas { width: 100%; height: 100%; transform: scaleX(-1); position: absolute; z-index: 1; }
  </style>
</head>
<body>
  <video id="vid"></video>
  <canvas id="c"></canvas>
  <script>
    var vid = document.getElementById('vid');
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');
    var arr = [];
    var cur = [];
    var shift = false;
    var draw = false;
    var sx = null;
    var sy = null;

    window.onkeydown = function(e) {
      if (e.key == 'Shift') shift = true;
      if (e.code == 'Space') arr = [];
    }
    
    window.onkeyup = function(e) {
      if (e.key == 'Shift') shift = false;
    }

    function run(res) {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      // Background image
      ctx.drawImage(res.image, 0, 0, c.width, c.height);
      if (enableFade) {
        ctx.fillStyle = 'rgba(10, 6, 2, 0.25)';
      } else {
        ctx.fillStyle = 'rgba(10, 6, 2, 0.85)';
      }
      ctx.fillRect(0, 0, c.width, c.height);

      // brush settings
      ctx.shadowColor = brushColor;
      ctx.shadowBlur = 8;
      ctx.strokeStyle = brushColor;
      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (var i = 0; i < arr.length; i++) {
        ctx.beginPath();
        for (var j = 0; j < arr[i].length; j++) {
          if (j == 0) ctx.moveTo(arr[i][j].x, arr[i][j].y);
          else ctx.lineTo(arr[i][j].x, arr[i][j].y);
        }
        ctx.stroke();
      }

      if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
        var lm = res.multiHandLandmarks[0];
        drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: 'rgba(245, 208, 97, 0.3)', lineWidth: 2});
        drawLandmarks(ctx, lm, {color: '#FFFFFF', lineWidth: 1, radius: 2});

        var ind = lm[8];
        var rx = ind.x * c.width;
        var ry = ind.y * c.height;

        if (sx == null) {
          sx = rx; 
          sy = ry;
        } else {
          sx += (rx - sx) * 0.45;
          sy += (ry - sy) * 0.45;
        }

        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(3, brushSize/2), 0, 2 * Math.PI);
        if (isDrawingActive()) { 
          ctx.fillStyle = '#FFFFFF'; 
        } else { 
          ctx.fillStyle = 'rgba(245, 208, 97, 0.4)'; 
        }
        ctx.fill();

        if (isDrawingActive()) {
          if (!draw) {
            draw = true;
            cur = [];
            arr.push(cur);
            // push history snapshot
            pushHistory();
          }
          cur.push({x: sx, y: sy, color: brushColor, size: brushSize});
          if (enableParticles) spawnParticle(sx, sy, brushColor);
        } else {
          draw = false;
        }
      } else {
        draw = false;
        sx = null;
      }

      // update and draw particles
      for (var p = particles.length - 1; p >= 0; p--) {
        var P = particles[p];
        P.x += P.vx; P.y += P.vy; P.life -= 1; P.alpha *= 0.98;
        ctx.beginPath(); ctx.globalAlpha = Math.max(0, P.alpha); ctx.fillStyle = P.color; ctx.arc(P.x, P.y, P.r, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
        if (P.life <= 0) particles.splice(p,1);
      }
    }

    var h = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });
    
    h.setOptions({ 
      maxNumHands: 1, 
      modelComplexity: 1, 
      minDetectionConfidence: 0.5, 
      minTrackingConfidence: 0.5 
    });
    
    h.onResults(run);

    var cam = new Camera(vid, {
      onFrame: async () => { await h.send({image: vid}); },
      width: 1280, 
      height: 720
    });
    
    cam.start();

    // enhancements
    var brushColor = '#F5D061';
    var brushSize = 6;
    var enableParticles = false;
    var enableFade = false;
    var history = [];
    var redoStack = [];
    var maxHistory = 50;
    var particles = [];
    var mirrorEnabled = true;

    function spawnParticle(x,y,color){
      particles.push({x:x,y:y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,r:Math.random()*4+1,life:18,alpha:0.9,color:color});
      if (particles.length>300) particles.splice(0, particles.length-250);
    }

    function pushHistory(){
      try{
        history.push(JSON.stringify(arr));
        if (history.length>maxHistory) history.shift();
        redoStack = [];
      }catch(e){ }
    }

    function undo(){
      if (history.length>0){
        redoStack.push(JSON.stringify(arr));
        history.pop();
        var last = history[history.length-1] || '[]';
        arr = JSON.parse(last);
      }
    }

    function redo(){
      if (redoStack.length>0){
        var r = redoStack.pop();
        history.push(JSON.stringify(arr));
        arr = JSON.parse(r);
      }
    }

    function clearAll(){ arr = []; pushHistory(); }

    function saveImage(){
      var url = c.toDataURL('image/png');
      var a = document.createElement('a'); a.href = url; a.download = 'ramadan-drawing.png'; document.body.appendChild(a); a.click(); a.remove();
    }

    // Hook up controls
    document.getElementById('color').addEventListener('input', function(e){ brushColor = e.target.value; });
    document.getElementById('size').addEventListener('input', function(e){ brushSize = Number(e.target.value); });
    document.getElementById('particles').addEventListener('change', function(e){ enableParticles = e.target.checked; });
    document.getElementById('fade').addEventListener('change', function(e){ enableFade = e.target.checked; });
    document.getElementById('undo').addEventListener('click', function(){ undo(); });
    document.getElementById('redo').addEventListener('click', function(){ redo(); });
    document.getElementById('clear').addEventListener('click', function(){ clearAll(); });
    document.getElementById('save').addEventListener('click', function(){ saveImage(); });
    document.getElementById('mirror').addEventListener('change', function(e){ mirrorEnabled = e.target.checked; if (mirrorEnabled) c.style.transform = 'scaleX(-1)'; else c.style.transform = 'scaleX(1)'; });

    // initialize history with empty canvas
    pushHistory();
  </script>
</body>
</html>
